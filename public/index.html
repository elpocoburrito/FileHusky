<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#121417">
  <title>SrvFiles</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" v-cloak>
    <file-manager
      v-if="route.name === 'browse'"
      :path="route.path"
      @open-settings="settingsOpen = true"
    ></file-manager>

    <video-player
      v-else-if="route.name === 'video'"
      :path="route.path"
      :file-name="route.fileName"
      :folder="route.folder"
      @open-settings="settingsOpen = true"
    ></video-player>

    <settings-panel
      :open="settingsOpen"
      @close="settingsOpen = false"
    ></settings-panel>
  </div>

  <noscript>
    <p style="padding:2rem;font-family:sans-serif">SrvFiles requires JavaScript.</p>
  </noscript>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/components/FileManager.js"></script>
  <script src="js/components/VideoPlayer.js"></script>
  <script src="js/components/SettingsPanel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
