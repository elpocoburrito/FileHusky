<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121417">
  <!-- FileHusky mark: a husky head in the app accent colour -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%235b9bff' d='M7.5 9.5 9 1.5l5.5 5zM24.5 9.5 23 1.5l-5.5 5z'/%3E%3Ccircle cx='16' cy='17' r='12' fill='%235b9bff'/%3E%3Cpath fill='%23eef2f8' d='M16 29c-4.4 0-8-3.6-8-8 0-3 2.5-5.5 8-5.5s8 2.5 8 5.5c0 4.4-3.6 8-8 8z'/%3E%3Ccircle cx='11' cy='14.5' r='1.7' fill='%23121417'/%3E%3Ccircle cx='21' cy='14.5' r='1.7' fill='%23121417'/%3E%3Ccircle cx='16' cy='22.5' r='1.7' fill='%23121417'/%3E%3C/svg%3E">
  <style>html, body { touch-action: manipulation; }</style>
  <title>FileHusky</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Disable pinch-to-zoom on mobile for an app-like feel.
    // Note: iOS Safari ignores user-scalable=no, so pinch gestures are blocked
    // manually. Double-tap zoom needs no handler here: `touch-action:
    // manipulation` above already disables it — and a touchend preventDefault
    // would also suppress the synthesized click, eating every second fast tap.
    (function () {
      // iOS-specific pinch zoom gesture
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
      // Pinch (two-finger) touch zoom
      document.addEventListener('touchmove', function (e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
    })();
  </script>
</head>
<body>
  <div id="app" v-cloak>
    <file-manager
      v-if="route.name === 'browse'"
      :path="route.path"
      @open-settings="settingsOpen = true"
    ></file-manager>

    <video-player
      v-else-if="route.name === 'video'"
      :path="route.path"
      :file-name="route.fileName"
      :folder="route.folder"
      @open-settings="settingsOpen = true"
    ></video-player>

    <home-page
      v-else-if="route.name === 'home'"
      @open-settings="settingsOpen = true"
    ></home-page>

    <settings-panel
      :open="settingsOpen"
      @close="settingsOpen = false"
    ></settings-panel>
  </div>

  <noscript>
    <p style="padding:2rem;font-family:sans-serif">FileHusky requires JavaScript.</p>
  </noscript>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/tv.js"></script>
  <script src="js/components/FileManager.js"></script>
  <script src="js/components/Home.js"></script>
  <script src="js/components/VideoPlayer.js"></script>
  <script src="js/components/SettingsPanel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
